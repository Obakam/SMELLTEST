<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <pattern id="grain-tile" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" filter="url(#grain)"/>
    </pattern>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f3ead9"/>
      <stop offset="1" stop-color="#e2cfb0"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b978"/>
      <stop offset="1" stop-color="#b8762f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="215" fill="#ffffff" opacity="0.28"/>
  <circle cx="300" cy="330" r="215" fill="none" stroke="#2b2420" stroke-opacity="0.22" stroke-width="1"/>
  <ellipse cx="300" cy="668" rx="152" ry="20" fill="#b8762f" opacity="0.18"/>

  <g>
    <!-- cap -->
    <rect x="253.8" y="150.0" width="92.4" height="86.0" rx="6" fill="#2b2420"/>
    <rect x="263.8" y="158.0" width="14.7" height="70.0" fill="#ffffff" opacity="0.22"/>
    <!-- collar -->
    <rect x="241.2" y="234.0" width="117.6" height="16" rx="3" fill="#2b2420" opacity="0.85"/>
    <!-- neck -->
    <rect x="270.6" y="248.0" width="58.8" height="56" fill="#ffffff" opacity="0.32"/>
    <!-- glass body -->
    <rect x="195.0" y="300.0" width="210.0" height="360.0" rx="16" fill="#ffffff" opacity="0.34"/>
    <!-- juice -->
    <rect x="200.0" y="330.0" width="200.0" height="322.0" rx="13" fill="url(#juice)"/>
    <!-- label -->
    <rect x="237.0" y="408.0" width="126.0" height="122.4" fill="#f9f5ee" opacity="0.96"/>
    <rect x="242.0" y="413.0" width="116.0" height="112.4" fill="none" stroke="#2b2420" stroke-opacity="0.5" stroke-width="1"/>
    <text x="300" y="458.4" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35.7" letter-spacing="3" fill="#b8762f">BT</text>
    <line x1="274" y1="480.0" x2="326" y2="480.0" stroke="#2b2420" stroke-opacity="0.6" stroke-width="1"/>
    <text x="300" y="507.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.6" fill="#b8762f" opacity="0.75">LAGOS</text>
    <!-- glass highlight -->
    <rect x="207.0" y="314.0" width="21.0" height="316.0" rx="9" fill="#ffffff" opacity="0.42"/>
    <rect x="379.0" y="324.0" width="10.5" height="290.0" rx="6" fill="#ffffff" opacity="0.20"/>
    <!-- outline -->
    <rect x="195.0" y="300.0" width="210.0" height="360.0" rx="16" fill="none" stroke="#2b2420" stroke-opacity="0.16" stroke-width="1"/>
  </g>
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#2b2420" stroke-opacity="0.14" stroke-width="1"/>
  <rect width="600" height="800" fill="url(#grain-tile)" opacity="0.5"/>
</svg>
