<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <pattern id="grain-tile" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" filter="url(#grain)"/>
    </pattern>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e6d6"/>
      <stop offset="1" stop-color="#d8c2a8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#hbg)"/>
  <circle cx="400" cy="430" r="290" fill="#e7d3ba" opacity="0.65"/>
  <circle cx="400" cy="430" r="290" fill="none" stroke="#8f6f4e" stroke-opacity="0.18"/>
  <!-- botanicals -->
  <g opacity="0.5" stroke="#5d6b4a" stroke-width="3" fill="none">
    <path d="M120 760 C170 660 180 560 160 470"/>
    <path d="M160 640 C130 620 112 590 108 556 C140 566 158 596 160 640 Z" fill="#5d6b4a" fill-opacity="0.28"/>
    <path d="M168 570 C200 552 216 522 220 488 C188 498 170 528 168 570 Z" fill="#5d6b4a" fill-opacity="0.28"/>
    <path d="M680 800 C650 700 650 600 672 512"/>
    <path d="M666 660 C700 646 720 618 726 586 C692 596 672 624 666 660 Z" fill="#5d6b4a" fill-opacity="0.28"/>
  </g>
  <!-- petals -->
  <g fill="#b4552d" opacity="0.42">
    <ellipse cx="640" cy="230" rx="34" ry="16" transform="rotate(-24 640 230)"/>
    <ellipse cx="676" cy="268" rx="26" ry="12" transform="rotate(18 676 268)"/>
    <ellipse cx="140" cy="300" rx="28" ry="13" transform="rotate(30 140 300)"/>
  </g>
  <ellipse cx="400" cy="830" rx="200" ry="24" fill="#6d5136" opacity="0.22"/>
  
  <g>
    <!-- cap -->
    <rect x="334.0" y="200.0" width="132.0" height="86.0" rx="6" fill="#c9a227"/>
    <rect x="344.0" y="208.0" width="21.0" height="70.0" fill="#ffffff" opacity="0.22"/>
    <!-- collar -->
    <rect x="316.0" y="284.0" width="168.0" height="16" rx="3" fill="#c9a227" opacity="0.85"/>
    <!-- neck -->
    <rect x="358.0" y="298.0" width="84.0" height="56" fill="#ffffff" opacity="0.32"/>
    <!-- glass body -->
    <rect x="250.0" y="350.0" width="300.0" height="470.0" rx="16" fill="#ffffff" opacity="0.34"/>
    <!-- juice -->
    <rect x="255.0" y="380.0" width="290.0" height="432.0" rx="13" fill="url(#juice)"/>
    <!-- label -->
    <rect x="310.0" y="491.0" width="180.0" height="159.8" fill="#f9f5ee" opacity="0.96"/>
    <rect x="315.0" y="496.0" width="170.0" height="149.8" fill="none" stroke="#c9a227" stroke-opacity="0.5" stroke-width="1"/>
    <text x="400" y="556.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="51.0" letter-spacing="3" fill="#3d1f2b">BT</text>
    <line x1="374" y1="585.0" x2="426" y2="585.0" stroke="#c9a227" stroke-opacity="0.6" stroke-width="1"/>
    <text x="400" y="620.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.6" fill="#3d1f2b" opacity="0.75">LAGOS</text>
    <!-- glass highlight -->
    <rect x="262.0" y="364.0" width="30.0" height="426.0" rx="9" fill="#ffffff" opacity="0.42"/>
    <rect x="524.0" y="374.0" width="15.0" height="400.0" rx="6" fill="#ffffff" opacity="0.20"/>
    <!-- outline -->
    <rect x="250.0" y="350.0" width="300.0" height="470.0" rx="16" fill="none" stroke="#2b2420" stroke-opacity="0.16" stroke-width="1"/>
  </g>
  <rect x="38" y="38" width="724" height="924" fill="none" stroke="#2b2420" stroke-opacity="0.2"/>
  <rect width="800" height="1000" fill="url(#grain-tile)" opacity="0.5"/>
</svg>
