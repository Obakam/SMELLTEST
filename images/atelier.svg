<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" role="img">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <pattern id="grain-tile" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" filter="url(#grain)"/>
    </pattern>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe3d3"/>
      <stop offset="1" stop-color="#cfbaa0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="960" fill="url(#abg)"/>
  <rect x="60" y="110" width="680" height="740" fill="#fbf6ec" opacity="0.6"/>

  <!-- pressed botanicals -->
  <g stroke="#5d6b4a" stroke-width="3" fill="none" opacity="0.65">
    <path d="M150 760 C200 660 210 560 190 470"/>
    <path d="M190 640 C158 622 140 592 136 558 C168 568 186 598 190 640 Z" fill="#5d6b4a" fill-opacity="0.3"/>
    <path d="M198 566 C230 548 246 518 250 484 C218 494 200 524 198 566 Z" fill="#5d6b4a" fill-opacity="0.3"/>
    <path d="M660 780 C632 690 632 600 652 520"/>
    <path d="M646 660 C678 646 698 620 704 590 C672 600 652 626 646 660 Z" fill="#5d6b4a" fill-opacity="0.3"/>
  </g>

  <!-- citrus halves -->
  <g transform="translate(650 300)">
    <circle r="72" fill="#d99a3c" opacity="0.9"/>
    <circle r="60" fill="#f2d9a8"/>
    <g stroke="#d99a3c" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-58" x2="0" y2="58"/><line x1="-58" y1="0" x2="58" y2="0"/>
      <line x1="-41" y1="-41" x2="41" y2="41"/><line x1="-41" y1="41" x2="41" y2="-41"/>
    </g>
    <circle r="60" fill="none" stroke="#a86c22" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- petals scattered -->
  <g fill="#b4552d" opacity="0.5">
    <ellipse cx="200" cy="330" rx="36" ry="16" transform="rotate(-18 200 330)"/>
    <ellipse cx="238" cy="368" rx="28" ry="12" transform="rotate(24 238 368)"/>
    <ellipse cx="574" cy="700" rx="34" ry="15" transform="rotate(12 574 700)"/>
    <ellipse cx="530" cy="738" rx="24" ry="11" transform="rotate(-32 530 738)"/>
  </g>

  <!-- bottle on its side -->
  <g transform="translate(370 560) rotate(-72)">
    
  <g>
    <!-- cap -->
    <rect x="-46.2" y="-180.0" width="92.4" height="86.0" rx="6" fill="#c9a227"/>
    <rect x="-36.2" y="-172.0" width="14.7" height="70.0" fill="#ffffff" opacity="0.22"/>
    <!-- collar -->
    <rect x="-58.8" y="-96.0" width="117.6" height="16" rx="3" fill="#c9a227" opacity="0.85"/>
    <!-- neck -->
    <rect x="-29.4" y="-82.0" width="58.8" height="56" fill="#ffffff" opacity="0.32"/>
    <!-- glass body -->
    <rect x="-105.0" y="-30.0" width="210.0" height="360.0" rx="16" fill="#ffffff" opacity="0.34"/>
    <!-- juice -->
    <rect x="-100.0" y="0.0" width="200.0" height="322.0" rx="13" fill="url(#juice)"/>
    <!-- label -->
    <rect x="-63.0" y="78.0" width="126.0" height="122.4" fill="#f9f5ee" opacity="0.96"/>
    <rect x="-58.0" y="83.0" width="116.0" height="112.4" fill="none" stroke="#c9a227" stroke-opacity="0.5" stroke-width="1"/>
    <text x="0" y="128.4" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35.7" letter-spacing="3" fill="#3d1f2b">BT</text>
    <line x1="-26" y1="150.0" x2="26" y2="150.0" stroke="#c9a227" stroke-opacity="0.6" stroke-width="1"/>
    <text x="0" y="177.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.6" fill="#3d1f2b" opacity="0.75">LAGOS</text>
    <!-- glass highlight -->
    <rect x="-93.0" y="-16.0" width="21.0" height="316.0" rx="9" fill="#ffffff" opacity="0.42"/>
    <rect x="79.0" y="-6.0" width="10.5" height="290.0" rx="6" fill="#ffffff" opacity="0.20"/>
    <!-- outline -->
    <rect x="-105.0" y="-30.0" width="210.0" height="360.0" rx="16" fill="none" stroke="#2b2420" stroke-opacity="0.16" stroke-width="1"/>
  </g>
  </g>

  <!-- fabric swatch -->
  <rect x="92" y="640" width="230" height="150" rx="4" fill="#b0603a" opacity="0.55"/>
  <g stroke="#7d3417" stroke-opacity="0.4" stroke-width="2">
    <line x1="92" y1="676" x2="322" y2="676"/><line x1="92" y1="712" x2="322" y2="712"/>
    <line x1="92" y1="748" x2="322" y2="748"/>
  </g>

  <rect x="46" y="46" width="708" height="868" fill="none" stroke="#2b2420" stroke-opacity="0.18"/>
  <rect width="800" height="960" fill="url(#grain-tile)" opacity="0.5"/>
</svg>
