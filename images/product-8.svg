<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <pattern id="grain-tile" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" filter="url(#grain)"/>
    </pattern>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f3e9dc"/>
      <stop offset="1" stop-color="#dcc7ae"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87f57"/>
      <stop offset="1" stop-color="#6b4a2f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="380" r="205" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="300" cy="656" rx="168" ry="20" fill="#6b4a2f" opacity="0.18"/>
  <rect x="196" y="286" width="208" height="360" rx="14" fill="#ffffff" opacity="0.30"/>
  <rect x="202" y="360" width="196" height="280" rx="10" fill="url(#juice)"/>
  <ellipse cx="300" cy="364" rx="98" ry="18" fill="#a87f57" opacity="0.9"/>
  <ellipse cx="300" cy="364" rx="98" ry="18" fill="none" stroke="#6b4a2f" stroke-opacity="0.3"/>
  <rect x="192" y="252" width="216" height="42" rx="8" fill="#2b2420"/>
  <rect x="192" y="252" width="216" height="42" rx="8" fill="#ffffff" opacity="0.12"/>
  <rect x="232" y="430" width="136" height="150" fill="#f9f5ee" opacity="0.96"/>
  <rect x="237" y="435" width="126" height="140" fill="none" stroke="#2b2420" stroke-opacity="0.5"/>
  <text x="300" y="492" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="4" fill="#6b4a2f">BT</text>
  <line x1="262" y1="512" x2="338" y2="512" stroke="#2b2420" stroke-opacity="0.6"/>
  <text x="300" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#6b4a2f" opacity="0.8">ATELIER No.14</text>
  <rect x="214" y="298" width="20" height="330" rx="9" fill="#ffffff" opacity="0.34"/>
  <rect x="196" y="286" width="208" height="360" rx="14" fill="none" stroke="#2b2420" stroke-opacity="0.16"/>
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#2b2420" stroke-opacity="0.14" stroke-width="1"/>
  <rect width="600" height="800" fill="url(#grain-tile)" opacity="0.5"/>
</svg>
